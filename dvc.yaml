# 历史 v0/v1 stage（build_contract/train_v0/eval_v0/build_contract_v1/train_v1/eval_v1）
# 已随 merged_v2 数据集（anomod_v1 + endpoint_raw2 + normal_v2，全部丢失/删除）
# 一并退役移除，链路不可重建，历史数字以已提交的 metrics.json 为"当时如此"记录。
# 详见 history/entries/034。现行主链路在 dvc_new_merge/dvc.yaml。
stages:
  train:
    cmd: python scripts/train_baseline.py --toy --out artifacts/scores.parquet --seed 42
    deps:
      - scripts/train_baseline.py
    outs:
      - artifacts/scores.parquet

  eval:
    cmd: python scripts/eval.py --scores artifacts/scores.parquet --out artifacts/metrics.json
    deps:
      - scripts/eval.py
      - src/contracts
      - artifacts/scores.parquet
    metrics:
      - artifacts/metrics.json:
          cache: false
