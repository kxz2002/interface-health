stages:
  train:
    cmd: python scripts/train_baseline.py --toy --out artifacts/scores.parquet --seed 42
    deps:
      - scripts/train_baseline.py
    outs:
      - artifacts/scores.parquet

  eval:
    cmd: python scripts/eval.py --scores artifacts/scores.parquet --out artifacts/metrics.json
    deps:
      - scripts/eval.py
      - src/contracts
      - artifacts/scores.parquet
    metrics:
      - artifacts/metrics.json:
          cache: false

  build_contract:
    cmd: python scripts/build_contract.py --config configs/contract/v0.yaml --dataset
      configs/data/merged_v2.yaml --out-dir artifacts/contract_v0 --seed 42
    deps:
      - scripts/build_contract.py
      - src/preprocessors
      - src/contracts/contract_v0.py
      - src/data/normalization.py
      - src/data/dataset_config.py
      - configs/contract/v0.yaml
      - configs/contract/endpoint_to_service.yaml
      - configs/data/merged_v2.yaml
    outs:
      - artifacts/contract_v0/train.parquet
      - artifacts/contract_v0/eval_all.parquet
      - artifacts/contract_v0/normalization_stats.json
      - artifacts/contract_v0/schema.json

  train_v0:
    cmd: python scripts/train_baseline_v0.py contract_dir=artifacts/contract_v0
      out=artifacts/baseline_v0/scores.parquet seed=42 training.epochs=50
      fusion=concat model=deep_svdd
    deps:
      - scripts/train_baseline_v0.py
      - configs/base.yaml
      - configs/fusion/concat.yaml
      - configs/model/deep_svdd.yaml
      - configs/training/default.yaml
      - src/models/deep_svdd.py
      - src/fusion/early_concat.py
      - src/fusion/base.py
      - src/data/contract_dataloader.py
      - artifacts/contract_v0/train.parquet
      - artifacts/contract_v0/eval_all.parquet
      - artifacts/contract_v0/schema.json
    outs:
      - artifacts/baseline_v0/scores.parquet

  eval_v0:
    cmd: python scripts/eval_baseline_v0.py --scores artifacts/baseline_v0/scores.parquet
      --out artifacts/baseline_v0/metrics.json
    deps:
      - scripts/eval_baseline_v0.py
      - src/contracts
      - artifacts/baseline_v0/scores.parquet
    metrics:
      - artifacts/baseline_v0/metrics.json:
          cache: false

  build_contract_v1:
    cmd: python scripts/build_contract.py --config configs/contract/v1.yaml --dataset
      configs/data/merged_v2.yaml --out-dir artifacts/contract_v1 --seed 42
    deps:
      - scripts/build_contract.py
      - src/preprocessors
      - src/contracts/contract_v0.py
      - src/contracts/split_v1.py
      - src/data/normalization.py
      - src/data/dataset_config.py
      - src/data/endpoint_baseline_stats.py
      - configs/contract/v1.yaml
      - configs/contract/endpoint_to_service.yaml
      - configs/data/merged_v2.yaml
    outs:
      - artifacts/contract_v1/train_fit.parquet
      - artifacts/contract_v1/train_val.parquet
      - artifacts/contract_v1/eval_normal_holdout.parquet
      - artifacts/contract_v1/train.parquet
      - artifacts/contract_v1/eval_all.parquet
      - artifacts/contract_v1/normalization_stats.json
      - artifacts/contract_v1/endpoint_baseline_stats.json
      - artifacts/contract_v1/schema.json

  train_v1:
    cmd: python scripts/train_baseline_v0.py contract_dir=artifacts/contract_v1
      out=artifacts/baseline_v1/scores.parquet seed=42 training.epochs=50
      fusion=concat model=deep_svdd
    deps:
      - scripts/train_baseline_v0.py
      - configs/base.yaml
      - configs/fusion/concat.yaml
      - configs/model/deep_svdd.yaml
      - configs/training/default.yaml
      - src/models/deep_svdd.py
      - src/fusion/early_concat.py
      - src/fusion/base.py
      - src/data/contract_dataloader.py
      - artifacts/contract_v1/train.parquet
      - artifacts/contract_v1/eval_all.parquet
      - artifacts/contract_v1/schema.json
    outs:
      - artifacts/baseline_v1/scores.parquet

  eval_v1:
    cmd: python scripts/eval_baseline_v0.py --scores artifacts/baseline_v1/scores.parquet
      --out artifacts/baseline_v1/metrics.json
    deps:
      - scripts/eval_baseline_v0.py
      - src/contracts
      - artifacts/baseline_v1/scores.parquet
    metrics:
      - artifacts/baseline_v1/metrics.json:
          cache: false

  build_contract_v1_expanded:
    # RG（ReliabilityGatedFusion）专属：训练池扩容（吸收故障 case baseline 阶段行，
    # 838→~6249 行），与 L0/L1/L2 用的 build_contract_v1（不扩容）分开，避免主对比
    # baseline 的 eval 集合被悄悄改变。见 history/entries/014-reliability-gate-fusion.md。
    cmd: python scripts/build_contract.py --config configs/contract/v1_expanded_pool.yaml
      --dataset configs/data/merged_v2.yaml --out-dir artifacts/contract_v1_expanded --seed 42
    deps:
      - scripts/build_contract.py
      - src/preprocessors
      - src/contracts/contract_v0.py
      - src/contracts/split_v1.py
      - src/data/normalization.py
      - src/data/dataset_config.py
      - src/data/endpoint_baseline_stats.py
      - configs/contract/v1_expanded_pool.yaml
      - configs/contract/endpoint_to_service.yaml
      - configs/data/merged_v2.yaml
    outs:
      - artifacts/contract_v1_expanded/train_fit.parquet
      - artifacts/contract_v1_expanded/train_val.parquet
      - artifacts/contract_v1_expanded/eval_normal_holdout.parquet
      - artifacts/contract_v1_expanded/train.parquet
      - artifacts/contract_v1_expanded/eval_all.parquet
      - artifacts/contract_v1_expanded/normalization_stats.json
      - artifacts/contract_v1_expanded/endpoint_baseline_stats.json
      - artifacts/contract_v1_expanded/schema.json

  train_v1_reliability_gate:
    cmd: python scripts/train_baseline_v0.py contract_dir=artifacts/contract_v1_expanded
      out=artifacts/baseline_v1_reliability_gate/scores.parquet seed=42
      training.epochs=50 fusion=reliability_gate model=deep_svdd
    deps:
      - scripts/train_baseline_v0.py
      - configs/base.yaml
      - configs/fusion/reliability_gate.yaml
      - configs/model/deep_svdd.yaml
      - configs/training/default.yaml
      - configs/contract/endpoint_to_service.yaml
      - src/models/deep_svdd.py
      - src/fusion/reliability_gate.py
      - src/fusion/base.py
      - src/data/contract_dataloader.py
      - src/data/endpoint_baseline_stats.py
      - artifacts/contract_v1_expanded/train.parquet
      - artifacts/contract_v1_expanded/eval_all.parquet
      - artifacts/contract_v1_expanded/schema.json
      - artifacts/contract_v1_expanded/endpoint_baseline_stats.json
    outs:
      - artifacts/baseline_v1_reliability_gate/scores.parquet

  eval_v1_reliability_gate:
    cmd: python scripts/eval_baseline_v0.py
      --scores artifacts/baseline_v1_reliability_gate/scores.parquet
      --out artifacts/baseline_v1_reliability_gate/metrics.json
    deps:
      - scripts/eval_baseline_v0.py
      - src/contracts
      - artifacts/baseline_v1_reliability_gate/scores.parquet
    metrics:
      - artifacts/baseline_v1_reliability_gate/metrics.json:
          cache: false
