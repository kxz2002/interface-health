# service_minimal_v1：service 级单类异常检测冻结协议（T0）
#
# 本文件是协议的唯一事实源。所有规则显式记录：缺字段或类型非法由
# src/service/protocol.py 的 load_protocol 直接报错；配置里没有的特征、
# 服务、case、方法不允许在下游默默加入。禁止任何 Fault 适配分支、
# score-dependent 选择与超参数搜索（见本文件末尾 freeze 段）。

# ── 运行时字段（仿 configs/base.yaml 先例，与协议同文件）─────────────────
# command/out 为必填占位；"???" 在 yaml.safe_load 下是字符串，load_protocol
# 只严格校验协议字段，容忍运行时字段存在。
command: ???
out: ???
data_dir: null
run_dir: null
evaluation_dir: null
dataset: configs/data/new_merge.yaml

# ── 协议标识与固定参数（§6.1）────────────────────────────────────────────
protocol_id: service_minimal_v1
window_ms: 15000
guard_ms: 30000
seed: 42

split:
  fit_frac: 0.6
  val_frac: 0.2
min_fit_rows: 30
min_calibration_rows: 10

# 资源序列诊断参数
max_counter_gap_s: 30
transition_ms: 30000

# S2 固定事件检索参数（T0 冻结，T4 才消费）
event_min_coverage: 0.8
event_top_fraction: 0.2

# 检测器方法白名单（顺序即报告列序）；不允许配置外方法
methods: [L2, max, OCSVM, IF]
feature_groups:
  R3: [cpu_cores, memory_usage_ratio, process_count]
  CPU-only: [cpu_cores]

# ── 冻结 case（§1.2，恰好 4 个；时间边界直接取自各 case 的 trace_data/case_metadata.json）
cases:
  - case_id: Normal_20260728T161044Z
    role: normal
    is_anomaly_case: false
    window_start_ms: 1785255051635
    window_end_ms: 1785256860279
    inject_start_ms: null
    inject_end_ms: null
    target_service: null
    recoverable: null
  - case_id: Lv_P_CPU_preserve_20260728T164711Z_em
    role: cpu
    is_anomaly_case: true
    window_start_ms: 1785257238975
    window_end_ms: 1785259168099
    inject_start_ms: 1785258442613
    inject_end_ms: 1785259047896
    target_service: ts-preserve-service
    recoverable: true
    chaos_kind: StressChaos
    chaos_yaml: Lv_P_CPU_preserve.yaml
  - case_id: Lv_S_KILLPOD_order_20260728T203705Z_em
    role: kill
    is_anomaly_case: true
    window_start_ms: 1785271032082
    window_end_ms: 1785272840881
    # inject_end 比 window_end 大 90ms：网格只截到 window_end，自然无 recover 窗
    inject_start_ms: 1785272235656
    inject_end_ms: 1785272840971
    target_service: ts-order-service
    recoverable: false
    chaos_kind: Schedule
    chaos_yaml: Lv_S_KILLPOD_order.yaml
  - case_id: Lv_S_KILLPOD_preserve_20260728T200124Z_em
    role: kill
    is_anomaly_case: true
    window_start_ms: 1785268892419
    window_end_ms: 1785270701274
    inject_start_ms: 1785270096005
    inject_end_ms: 1785270701381
    target_service: ts-preserve-service
    recoverable: false
    chaos_kind: Schedule
    chaos_yaml: Lv_S_KILLPOD_preserve.yaml

# ── 冻结候选服务（§1.3，字典序；数据库/基础设施不在候选；不随标签/分数/覆盖改变）
services:
  - ts-assurance-service
  - ts-auth-service
  - ts-basic-service
  - ts-cancel-service
  - ts-config-service
  - ts-contacts-service
  - ts-execute-service
  - ts-gateway-service
  - ts-inside-payment-service
  - ts-notification-service
  - ts-order-other-service
  - ts-order-service
  - ts-payment-service
  - ts-preserve-other-service
  - ts-preserve-service
  - ts-price-service
  - ts-rebook-service
  - ts-route-service
  - ts-seat-service
  - ts-security-service
  - ts-station-service
  - ts-train-service
  - ts-travel-service
  - ts-travel2-service
  - ts-user-service

# ── 身份规则（§4.1）──────────────────────────────────────────────────────
identity:
  # 冻结 registry：Normal case 实测唯一 Pod 全名 → canonical service。
  # Pod 规范化只能命中此表、显式别名，或严格 Deployment 后缀模式
  # （<service>-<rs-hash>-<pod-hash>，两段 hash 非空且前缀在 services 内）；
  # 不允许朴素截掉服务名最后两段。
  registry:
    ts-assurance-service-77cc6cd6fd-h2kp7: ts-assurance-service
    ts-auth-service-859b7fb6f8-cpmb5: ts-auth-service
    ts-basic-service-6dcc67d7d9-fmzdh: ts-basic-service
    ts-cancel-service-7c866df469-wmsj8: ts-cancel-service
    ts-config-service-5b8955b566-lzx42: ts-config-service
    ts-contacts-service-7955bf6f9d-bqf45: ts-contacts-service
    ts-execute-service-947f78cd8-79nr5: ts-execute-service
    ts-gateway-service-74b958d5f7-sqcw5: ts-gateway-service
    ts-inside-payment-service-5b8ddbf69d-jk6l9: ts-inside-payment-service
    ts-notification-service-787c49cdb8-nm6sw: ts-notification-service
    ts-order-other-service-7cb7bfc447-5spm4: ts-order-other-service
    ts-order-service-6c44d949d9-kmd96: ts-order-service
    ts-payment-service-59997499d8-vf4qk: ts-payment-service
    ts-preserve-other-service-699678b998-ll8jn: ts-preserve-other-service
    ts-preserve-service-5b54899475-hbpqd: ts-preserve-service
    ts-price-service-5568d4f9b6-xlxkk: ts-price-service
    ts-rebook-service-6b9b7fbb8b-9lh2n: ts-rebook-service
    ts-route-service-6f96d6c98-fmgwv: ts-route-service
    ts-seat-service-5d55754f88-xkxwj: ts-seat-service
    ts-security-service-64996ff68-gwdfs: ts-security-service
    ts-station-service-7fdcb4d5df-xjkm4: ts-station-service
    ts-train-service-6798ffd58d-9mwlc: ts-train-service
    ts-travel-service-8fb54c6bb-s69w2: ts-travel-service
    ts-travel2-service-6846dd5cb-dr6mc: ts-travel2-service
    ts-user-service-88b78bcf9-fd2h9: ts-user-service
  # StatefulSet 只能走显式别名；别名目标（数据库/基础设施）不加入 services 候选
  statefulset_aliases:
    tsdb-mysql-0: tsdb-mysql
    nacos-0: nacos
  # Normal 实测应用 container 名与 Service 名相同（见审计 metric_entities.csv，
  # 25 候选在 Normal case 均为单 Pod 单应用 container）；异常 container 名/sidecar
  # 不自动混入，只能在 extra_container_aliases 显式登记后才参与身份解析
  container_policy: service_name_equals_container
  application_container_mapping:
    ts-assurance-service: ts-assurance-service
    ts-auth-service: ts-auth-service
    ts-basic-service: ts-basic-service
    ts-cancel-service: ts-cancel-service
    ts-config-service: ts-config-service
    ts-contacts-service: ts-contacts-service
    ts-execute-service: ts-execute-service
    ts-gateway-service: ts-gateway-service
    ts-inside-payment-service: ts-inside-payment-service
    ts-notification-service: ts-notification-service
    ts-order-other-service: ts-order-other-service
    ts-order-service: ts-order-service
    ts-payment-service: ts-payment-service
    ts-preserve-other-service: ts-preserve-other-service
    ts-preserve-service: ts-preserve-service
    ts-price-service: ts-price-service
    ts-rebook-service: ts-rebook-service
    ts-route-service: ts-route-service
    ts-seat-service: ts-seat-service
    ts-security-service: ts-security-service
    ts-station-service: ts-station-service
    ts-train-service: ts-train-service
    ts-travel-service: ts-travel-service
    ts-travel2-service: ts-travel2-service
    ts-user-service: ts-user-service
  extra_container_aliases: {}
  allowed_namespaces: [default]
  allowed_jobs: [kubelet-cadvisor]
  # 原始序列键（去重/选实例用），namespace/job 缺省值
  raw_series_keys: [case_id, namespace, pod, container, id, instance, job, metric_name, cpu]
  default_namespace: default
  default_job: kubelet-cadvisor
  # CPU 优先 cpu=total；仅在该完整实例没有 total 且存在空 cpu 标签时退空标签；
  # 不累加每核，也不把每核与 total 相加
  cpu_label_preference: [total, ""]

# ── Schema 枚举（§5.1 / §8.1 / §10）──────────────────────────────────────
schema:
  version: service_minimal_v1
  feature_value_columns:
    - cpu_cores
    - memory_usage_ratio
    - process_count
    - memory_usage_bytes
    - memory_working_set_bytes
    - memory_limit_bytes
  feature_status_enum:
    - OBSERVED
    - UNOBSERVED
    - NO_DENOMINATOR
    - COUNTER_RESET
    - GAP
    - IDENTITY_AMBIGUOUS
    - TRANSITION
    - UNSUPPORTED
    - CONFLICTING_SAMPLE
  state_class_enum:
    - RESOURCE_CHANGE
    - EXECUTION_FAILURE
    - SERVICE_UNAVAILABLE
    - INSTANCE_TERMINATION
    - NO_OBSERVED_CHANGE
    - UNKNOWN
  evidence_grade_enum:
    - INDEPENDENT_STATE
    - CONTROLLED_EVENT
    - OBSERVATION_DERIVED
    - UNKNOWN
  evidence_unit_enum: [EVENT, WINDOW, INSTANCE]
  review_status_enum: [pending_human_review, confirmed, rejected]
  score_status_enum: [Scored, Unknown, Untrained]
  # Killing/Pod-kill 事实类：只证明实例终止，禁止自动升级为 SERVICE_UNAVAILABLE 金标
  termination_fact_types: [INSTANCE_TERMINATION, KILLING, POD_KILL]

# ── 冻结声明：无 Fault 适配、无超参搜索、无 score-dependent 选择 ──────────
freeze:
  fault_specific_adaptation: false
  hyperparameter_search: false
  score_dependent_selection: false
