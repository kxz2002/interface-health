contract_version: "v1"
window_size_s: 15
# 训练池扩容：train 额外吸收故障 case baseline 阶段行中最早
# fault_baseline_train_fraction 比例的时间窗，其余留在 eval_all 维持负样本
# 类别平衡（修复 issue #16，见 history/entries/016）。
expand_train_pool: true
# RG(ReliabilityGatedFusion)/DeviationWeightedFusion 消费 per-endpoint 基线统计量做
# 偏离量门控/加权，必须产出。
fit_endpoint_baseline_stats: true
# 实测校准（seed=42, dvc_new_merge，见 history/entries/023）：fraction=1.0
# （借用 new_ep1 数值）时正负比严重偏正，因为故障 baseline 行全部被吸收，只剩
# fan-out 残留+Normal holdout 的负样本地板；fraction=0.2（借用
# endpoint_raw2/v1_expanded_pool 数值）时量级上更接近 entry 016 对 endpoint_raw2
# 的校准目标（24.62:75.38）。两个数据集的 baseline_sec 量级差异（new_merge
# 1200s vs endpoint_raw2 300s）不改变本次结论——fraction 的最终效果取决于
# baseline_total 行数与其他负样本项的相对大小，而不能只看 baseline_sec 时长
# 类比。故选 0.2，不借用 new_ep1 的 1.0。
# 【数据集已清理】Lv_S_KILLPOD_gateway 因 inject 阶段 trace 数据永久缺失
# （ts-gateway-service 既是 chaos 目标又是 trace 上报通道，见
# docs/agent-docs/dataset-guide.md 第十一节同类已知问题）导致该 case 在
# eval_all 里 100% 落在 baseline phase、AUROC 数学上无定义，已从 data/new_merge/
# 物理删除并重新 dvc add（27 case）。以下是清理后的最终实测数字：
# fault_baseline_total=14857 fault_baseline_to_train=2879
# fault_baseline_to_eval=11978，eval_all=15809，正负比约 19.7:80.3
# （3113 正 / 12696 负）。清理前后 concat(L0) baseline overall AUROC
# 0.718→0.742，各分层同步小幅提升（去掉一个标签无效的 case，稀释效应消除）。
fault_baseline_train_fraction: 0.2
# inject 阶段非目标 endpoint 行（endpoint 级 fan-out 残留）吸收比例，判据
# is_endpoint_anomaly==False（兼容两种 label_granularity，不会误吸收正样本）。
# 完整说明见 configs/contract/v1_expanded_pool.yaml 同名字段注释、history/entries/022。
fault_inject_nontarget_train_fraction: 1.0
# recover 阶段非目标 endpoint 行吸收比例，判据 is_target_endpoint==False，且仅对
# label_granularity=="endpoint" 的 case 生效（case 级标签无法区分目标/非目标，
# 其 recover 行整段留 eval_all）；目标 endpoint 自身的 recover 行始终不吸收。
# 完整说明见 v1_expanded_pool.yaml 同名字段注释、history/entries/022。
fault_recover_nontarget_train_fraction: 1.0

modalities:
  endpoint_red:
    preprocessor: TracePreprocessor
    preprocessor_version: v0
    features:
      - trace_request_count
      - trace_latency_p50
      - trace_latency_p95
      - trace_error_rate
      - trace_5xx_rate
      - client_request_count
      - client_latency_p95
      - client_error_rate
      - client_5xx_rate
      - latency_divergence
    normalization: per_endpoint_min_max
    candidates_pool: []

  service_metric:
    preprocessor: MetricPreprocessor
    preprocessor_version: v0
    features:
      - cpu_usage_rate
      - memory_usage_ratio
      - net_rx_error_rate
      - net_tx_error_rate
      - process_count
    normalization: per_service_min_max
    candidates_pool: []

  service_log:
    preprocessor: LogPreprocessor
    preprocessor_version: v0
    features:
      - event_rate
      - error_ratio
      - template_diversity
    normalization: per_service_min_max
    candidates_pool: []
