  eval_new_merge_v2_gated:
    wdir: ..
    cmd: python scripts/eval_baseline_v0.py
      --scores artifacts/baseline_new_merge_v2_gated/scores.parquet
      --out artifacts/baseline_new_merge_v2_gated/metrics.json
    deps:
      - scripts/eval_baseline_v0.py
      - src/contracts
      - artifacts/baseline_new_merge_v2_gated/scores.parquet
    metrics:
