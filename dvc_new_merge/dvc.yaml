      - src/contracts
      - artifacts/trivial_baseline_v2_rel_pos/scores.parquet
    metrics:
      - artifacts/trivial_baseline_v2_rel_pos/metrics.json:
          cache: false

  score_trivial_v2_zscore_l2:
    wdir: ..
    cmd: python scripts/score_trivial_baselines.py
      --contract-dir artifacts/contract_new_merge_v2
      --baseline zscore_l2
      --out artifacts/trivial_baseline_v2_zscore_l2/scores.parquet
    deps:
