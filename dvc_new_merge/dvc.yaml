  eval_trivial_zscore_max:
    wdir: ..
    cmd: python scripts/eval_baseline_v0.py
      --scores artifacts/trivial_baseline_zscore_max/scores.parquet
      --out artifacts/trivial_baseline_zscore_max/metrics.json
    deps:
      - scripts/eval_baseline_v0.py
      - src/contracts
      - artifacts/trivial_baseline_zscore_max/scores.parquet
    metrics:
      - artifacts/trivial_baseline_zscore_max/metrics.json:
          cache: false

  # === contract v2（per-case z-score 归一化，entry 027/029）四臂 ===
  # contract_dir=artifacts/contract_new_merge_v2，与 v1 行集逐行相等、仅归一化
  # 口径不同；v2 产物无 endpoint_baseline_stats.json sidecar，四臂均不需要它
  # （selfref 的参照系是特征自身，见 src/fusion/deviation_weighted_selfref.py）。
  train_new_merge_v2_concat:
    wdir: ..
    cmd: python scripts/train_baseline_v0.py contract_dir=artifacts/contract_new_merge_v2
      out=artifacts/baseline_new_merge_v2_concat/scores.parquet seed=42
      training.epochs=50 fusion=concat model=deep_svdd
    deps:
      - scripts/train_baseline_v0.py
      - configs/base.yaml
      - configs/fusion/concat.yaml
      - configs/model/deep_svdd.yaml
      - configs/training/default.yaml
      - src/models/deep_svdd.py
      - src/fusion/early_concat.py
      - src/fusion/base.py
      - src/data/contract_dataloader.py
      - artifacts/contract_new_merge_v2/train.parquet
      - artifacts/contract_new_merge_v2/eval_all.parquet
      - artifacts/contract_new_merge_v2/schema.json
    outs:
      - artifacts/baseline_new_merge_v2_concat/scores.parquet

  eval_new_merge_v2_concat:
    wdir: ..
    cmd: python scripts/eval_baseline_v0.py
      --scores artifacts/baseline_new_merge_v2_concat/scores.parquet
      --out artifacts/baseline_new_merge_v2_concat/metrics.json
    deps:
      - scripts/eval_baseline_v0.py
      - src/contracts
      - artifacts/baseline_new_merge_v2_concat/scores.parquet
    metrics:
      - artifacts/baseline_new_merge_v2_concat/metrics.json:
          cache: false

  train_new_merge_v2_independent_concat:
    wdir: ..
    cmd: python scripts/train_baseline_v0.py contract_dir=artifacts/contract_new_merge_v2
      out=artifacts/baseline_new_merge_v2_independent_concat/scores.parquet seed=42
      training.epochs=50 fusion=independent_concat model=deep_svdd
