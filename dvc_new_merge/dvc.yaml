      --scores artifacts/baseline_new_merge_v2_deviation_weighted_selfref/scores.parquet
      --out artifacts/baseline_new_merge_v2_deviation_weighted_selfref/metrics.json
    deps:
      - scripts/eval_baseline_v0.py
      - src/contracts
      - artifacts/baseline_new_merge_v2_deviation_weighted_selfref/scores.parquet
    metrics:
      - artifacts/baseline_new_merge_v2_deviation_weighted_selfref/metrics.json:
          cache: false

  # v2 口径的三条平凡基线（与 v1 三条并列；rel_pos 不看特征，v1/v2 结果必须
  # 逐位相等——0.9656 同时是行等价红线的旁证）。
  score_trivial_v2_rel_pos:
    wdir: ..
    cmd: python scripts/score_trivial_baselines.py
      --contract-dir artifacts/contract_new_merge_v2
      --baseline rel_pos
      --out artifacts/trivial_baseline_v2_rel_pos/scores.parquet
    deps:
      - scripts/score_trivial_baselines.py
      - src/contracts
      - artifacts/contract_new_merge_v2/eval_all.parquet
    outs:
      - artifacts/trivial_baseline_v2_rel_pos/scores.parquet

  eval_trivial_v2_rel_pos:
    wdir: ..
    cmd: python scripts/eval_baseline_v0.py
      --scores artifacts/trivial_baseline_v2_rel_pos/scores.parquet
      --out artifacts/trivial_baseline_v2_rel_pos/metrics.json
    deps:
