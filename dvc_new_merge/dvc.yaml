  eval_trivial_v2_zscore_max:
    wdir: ..
    cmd: python scripts/eval_baseline_v0.py
      --scores artifacts/trivial_baseline_v2_zscore_max/scores.parquet
      --out artifacts/trivial_baseline_v2_zscore_max/metrics.json
