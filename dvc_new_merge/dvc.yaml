  eval_trivial_v2_zscore_l2:
    wdir: ..
    cmd: python scripts/eval_baseline_v0.py
      --scores artifacts/trivial_baseline_v2_zscore_l2/scores.parquet
      --out artifacts/trivial_baseline_v2_zscore_l2/metrics.json
