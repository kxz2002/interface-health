    wdir: ..
    cmd: python scripts/eval_baseline_v0.py
      --scores artifacts/baseline_new_merge_v2_independent_concat/scores.parquet
      --out artifacts/baseline_new_merge_v2_independent_concat/metrics.json
    deps:
      - scripts/eval_baseline_v0.py
      - src/contracts
      - artifacts/baseline_new_merge_v2_independent_concat/scores.parquet
    metrics:
      - artifacts/baseline_new_merge_v2_independent_concat/metrics.json:
          cache: false

  train_new_merge_v2_gated:
    wdir: ..
    cmd: python scripts/train_baseline_v0.py contract_dir=artifacts/contract_new_merge_v2
      out=artifacts/baseline_new_merge_v2_gated/scores.parquet seed=42
      training.epochs=50 fusion=gated model=deep_svdd
    deps:
      - scripts/train_baseline_v0.py
      - configs/base.yaml
      - configs/fusion/gated.yaml
      - configs/model/deep_svdd.yaml
      - configs/training/default.yaml
      - src/models/deep_svdd.py
      - src/fusion/gated.py
      - src/fusion/base.py
      - src/data/contract_dataloader.py
      - artifacts/contract_new_merge_v2/train.parquet
      - artifacts/contract_new_merge_v2/eval_all.parquet
      - artifacts/contract_new_merge_v2/schema.json
    outs:
