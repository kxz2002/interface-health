# new_ep1（endpoint 级故障注入数据集，2026-07-25/26 采集，见 history/entries/019）
# 专属 pipeline，从根 dvc.yaml 隔离出来，同 dvc_reliability_gate/dvc.yaml、
# dvc_deviation_weighted/dvc.yaml 的隔离模式（裸 `dvc repro` 不再触发这 3 个
# stage）。不与 anomod_v1/endpoint_raw2 等历史批次数据混合（entry 017 已证实
# 跨 run 合并会污染评估），独立 contract_dir。触发方式：
# `dvc repro dvc_new_ep1/dvc.yaml`（单跑某 stage 用
# `dvc_new_ep1/dvc.yaml:stage_name`）。DVC 3.67.1 强制 pipeline 文件名字面量为
# dvc.yaml，故放子目录。每个 stage 的 wdir: .. 让所有相对路径继续相对 repo
# 根解析。
stages:
  build_contract_new_ep1_expanded:
    wdir: ..
    cmd: python scripts/build_contract.py --config configs/contract/v1_new_ep1.yaml
      --dataset configs/data/new_ep1.yaml --out-dir artifacts/contract_new_ep1_expanded --seed 42
    deps:
      - scripts/build_contract.py
      - src/preprocessors
      - src/contracts/contract_v0.py
      - src/contracts/split_v1.py
      - src/contracts/split_fault_phase.py
      - src/data/normalization.py
      - src/data/dataset_config.py
      - src/data/endpoint_baseline_stats.py
      - configs/contract/v1_new_ep1.yaml
      - configs/contract/endpoint_to_service.yaml
      - configs/data/new_ep1.yaml
      - data/new_ep1
    outs:
      - artifacts/contract_new_ep1_expanded/train_fit.parquet
      - artifacts/contract_new_ep1_expanded/train_val.parquet
      - artifacts/contract_new_ep1_expanded/eval_normal_holdout.parquet
      - artifacts/contract_new_ep1_expanded/train.parquet
      - artifacts/contract_new_ep1_expanded/eval_all.parquet
      - artifacts/contract_new_ep1_expanded/normalization_stats.json
      - artifacts/contract_new_ep1_expanded/endpoint_baseline_stats.json
      - artifacts/contract_new_ep1_expanded/schema.json
      - artifacts/contract_new_ep1_expanded/drain3.bin

  train_new_ep1_concat:
    wdir: ..
    cmd: python scripts/train_baseline_v0.py contract_dir=artifacts/contract_new_ep1_expanded
      out=artifacts/baseline_new_ep1_concat/scores.parquet seed=42
      training.epochs=50 fusion=concat model=deep_svdd
    deps:
      - scripts/train_baseline_v0.py
      - configs/base.yaml
      - configs/fusion/concat.yaml
      - configs/model/deep_svdd.yaml
      - configs/training/default.yaml
      - src/models/deep_svdd.py
      - src/fusion/early_concat.py
      - src/fusion/base.py
      - src/data/contract_dataloader.py
      - artifacts/contract_new_ep1_expanded/train.parquet
      - artifacts/contract_new_ep1_expanded/eval_all.parquet
      - artifacts/contract_new_ep1_expanded/schema.json
    outs:
      - artifacts/baseline_new_ep1_concat/scores.parquet

  eval_new_ep1_concat:
    wdir: ..
    cmd: python scripts/eval_baseline_v0.py
      --scores artifacts/baseline_new_ep1_concat/scores.parquet
      --out artifacts/baseline_new_ep1_concat/metrics.json
    deps:
      - scripts/eval_baseline_v0.py
      - src/contracts
      - artifacts/baseline_new_ep1_concat/scores.parquet
    metrics:
      - artifacts/baseline_new_ep1_concat/metrics.json:
          cache: false

  train_new_ep1_deviation_weighted:
    wdir: ..
    cmd: python scripts/train_baseline_v0.py contract_dir=artifacts/contract_new_ep1_expanded
      out=artifacts/baseline_new_ep1_deviation_weighted/scores.parquet seed=42
      training.epochs=50 fusion=deviation_weighted model=deep_svdd
    deps:
      - scripts/train_baseline_v0.py
      - configs/base.yaml
      - configs/fusion/deviation_weighted.yaml
      - configs/model/deep_svdd.yaml
      - configs/training/default.yaml
      - configs/contract/endpoint_to_service.yaml
      - src/models/deep_svdd.py
      - src/fusion/deviation_weighted.py
      - src/fusion/base.py
      - src/data/contract_dataloader.py
      - src/data/endpoint_baseline_stats.py
      - artifacts/contract_new_ep1_expanded/train.parquet
      - artifacts/contract_new_ep1_expanded/eval_all.parquet
      - artifacts/contract_new_ep1_expanded/schema.json
      - artifacts/contract_new_ep1_expanded/endpoint_baseline_stats.json
    outs:
      - artifacts/baseline_new_ep1_deviation_weighted/scores.parquet

  eval_new_ep1_deviation_weighted:
    wdir: ..
    cmd: python scripts/eval_baseline_v0.py
      --scores artifacts/baseline_new_ep1_deviation_weighted/scores.parquet
      --out artifacts/baseline_new_ep1_deviation_weighted/metrics.json
    deps:
      - scripts/eval_baseline_v0.py
      - src/contracts
      - artifacts/baseline_new_ep1_deviation_weighted/scores.parquet
    metrics:
      - artifacts/baseline_new_ep1_deviation_weighted/metrics.json:
          cache: false
